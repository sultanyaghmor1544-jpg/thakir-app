<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050706"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>ذَكِّر</title><style>*{box-sizing:border-box}body{margin:0;background:#050706;color:#f4f7f5;font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro",sans-serif}header{padding:28px 18px 16px;text-align:center;position:sticky;top:0;background:rgba(5,7,6,.96);z-index:3;border-bottom:1px solid #163a29}h1{margin:0;font-size:32px;color:#57e38b}p{color:#aab7b0}.tabs{display:flex;gap:8px;padding:12px 14px;position:sticky;top:92px;background:#050706;z-index:2}.tab{flex:1;border:1px solid #245c3f;background:#0a110d;color:#b9c8c0;border-radius:14px;padding:12px;font-size:17px}.tab.active{background:#123d29;color:#fff;border-color:#57e38b}.progress{margin:0 14px 12px;height:8px;background:#142019;border-radius:9px;overflow:hidden}.bar{height:100%;background:#57e38b;width:0}.list{padding:0 14px 40px}.card{background:linear-gradient(145deg,#0a110d,#070b09);border:1px solid #214b35;border-radius:18px;margin:12px 0;padding:17px;box-shadow:0 5px 20px #0008}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.num{width:34px;height:34px;border:1px solid #57e38b;border-radius:50%;display:grid;place-items:center;color:#57e38b;font-weight:700}.count{color:#57e38b;border:1px solid #276c48;border-radius:20px;padding:5px 10px;font-size:13px;white-space:nowrap}.title{font-weight:700;color:#57e38b;font-size:17px;flex:1}.text{font-size:20px;line-height:2.05;margin:15px 0 12px;white-space:pre-wrap}.ref{color:#8e9b94;font-size:12px;margin-bottom:10px}.btn{width:100%;border:0;border-radius:13px;background:#163e2a;color:#fff;padding:13px;font-size:16px}.btn.done{background:#2b7b50}.empty{text-align:center;color:#8e9b94;padding:30px}.small{font-size:13px;color:#7f8b85}</style></head><body><header><h1>ذَكِّر</h1><p>أذكار الصباح والمساء</p></header><div class="tabs"><button id="morning" class="tab active">أذكار الصباح</button><button id="evening" class="tab">أذكار المساء</button></div><div class="progress"><div class="bar" id="bar"></div></div><main class="list" id="list"></main><script src="data.js"></script><script>let mode='morning';const state=JSON.parse(localStorage.getItem('dhikrState')||'{}');const list=document.getElementById('list'),bar=document.getElementById('bar');function key(){return mode==='morning'?'m':'e'}function render(){const arr=DHIKR[mode],done=state[key()]||{};list.innerHTML='';arr.forEach((d,i)=>{const cur=done[i]||0, complete=cur>=d.count;const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="top"><span class="num">${i+1}</span><div class="title">${d.title||'ذِكر'}</div><span class="count">${d.count===1?'مرة واحدة':d.count+' مرات'}</span></div><div class="text">${d.text}</div>${d.ref?`<div class="ref">${d.ref}</div>`:''}<button class="btn ${complete?'done':''}">${complete?'✓ تم':'اضغط للتسبيح'} ${d.count>1&&!complete?`(${cur}/${d.count})`:''}</button>`;c.querySelector('.btn').onclick=()=>{done[i]=complete?0:cur+1;state[key()]=done;localStorage.setItem('dhikrState',JSON.stringify(state));render()};list.appendChild(c)});const n=arr.length,p=Object.values(done).filter((v,i)=>v>=arr[i].count).length;bar.style.width=(p/n*100)+'%'}function setMode(m){mode=m;document.getElementById('morning').classList.toggle('active',m==='morning');document.getElementById('evening').classList.toggle('active',m==='evening');render()}document.getElementById('morning').onclick=()=>setMode('morning');document.getElementById('evening').onclick=()=>setMode('evening');render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
